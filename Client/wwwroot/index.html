<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>Event Management System</h1>

        <section id="create-event">
            <h2>Create Event</h2>
            <form id="event-form">
                <label for="name">Event Name</label>
                <input type="text" id="name" required maxlength="100">

                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" required>

                <label for="endDate">End Date</label>
                <input type="date" id="endDate" required>

                <label for="maxRegistrations">Max Registrations</label>
                <input type="number" id="maxRegistrations" required min="1">

                <label for="location">Location (city name, used for the weather forecast)</label>
                <input type="text" id="location" required maxlength="50">

                <button type="submit">Create Event</button>
            </form>
        </section>

        <section id="events-list">
            <h2>All Events</h2>
            <ul id="event-container"></ul>
        </section>

        <section id="edit-event" hidden>
            <h2>Edit Event</h2>
            <form id="edit-form">
                <input type="hidden" id="editId">

                <label for="editName">Event Name</label>
                <input type="text" id="editName" required maxlength="100">

                <label for="editStartDate">Start Date</label>
                <input type="date" id="editStartDate" required>

                <label for="editEndDate">End Date</label>
                <input type="date" id="editEndDate" required>

                <label for="editMaxRegistrations">Max Registrations</label>
                <input type="number" id="editMaxRegistrations" required min="1">

                <label for="editLocation">Location</label>
                <input type="text" id="editLocation" required maxlength="50">

                <button type="submit">Update Event</button>
                <button type="button" id="cancel-edit" class="secondary-btn">Cancel</button>
            </form>
        </section>

    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
