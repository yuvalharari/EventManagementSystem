<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>Event Management System</h1>

        <section id="create-event">
            <h2>Create Event</h2>
            <form id="event-form">
                <label for="name">Event Name</label>
                <input type="text" id="name" required>

                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" required style="direction: ltr;" lang="en">

                <label for="endDate">End Date</label>
                <input type="date" id="endDate" required style="direction: ltr;" lang="en">

                <label for="maxRegistrations">Max Registrations</label>
                <input type="number" id="maxRegistrations" required>

                <label for="location">Location</label>
                <input type="text" id="location" required>

                <button type="submit">Create Event</button>
            </form>
        </section>

        <section id="events-list">
            <h2>All Events</h2>
            <ul id="event-container"></ul>
        </section>

        <section id="edit-event" style="display: none; margin-top: 40px;">
            <h2>Edit Event</h2>
            <form id="edit-form">
                <input type="hidden" id="editId">

                <label for="editName">Event Name</label>
                <input type="text" id="editName" required>

                <label for="editStartDate">Start Date</label>
                <input type="date" id="editStartDate" required lang="en">

                <label for="editEndDate">End Date</label>
                <input type="date" id="editEndDate" required lang="en">

                <label for="editMaxRegistrations">Max Registrations</label>
                <input type="number" id="editMaxRegistrations" required>

                <label for="editLocation">Location</label>
                <input type="text" id="editLocation" required>

                <button type="submit">Update Event</button>
                <button type="button" onclick="cancelEdit()" style="background-color: gray;">Cancel</button>
            </form>
        </section>

    </div>

    <script>
        const API_BASE = 'https://localhost:7172/api/event';
        const container = document.getElementById('event-container');

        async function loadEvents() {
            container.innerHTML = '';
            try {
                const res = await fetch('https://localhost:7172/schedule');
                const events = await res.json();

                events.forEach(ev => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                <strong>Name:</strong> ${ev.name}<br>
                <strong>Start Date:</strong> ${ev.startDate.split("T")[0]}<br>
                <strong>End Date:</strong> ${ev.endDate.split("T")[0]}<br>
                <strong>Location:</strong> ${ev.location}<br>
                <strong>Max Registrations:</strong> ${ev.maxRegistrations}<br>
                <a href="${ev.googleMapsLink}" target="_blank" style="display:inline-block; margin-top:5px; color:blue;">
               📍 View on map
               </a><br>
               <button class="edit-btn" onclick="editEvent(${ev.id})">Edit</button>
               <button class="delete-btn" onclick="deleteEvent(${ev.id})">Delete</button>
                `;

                    container.appendChild(li);
                });

            } catch (err) {
                container.innerHTML = '<li>Failed to load events.</li>';
            }
        }

        async function deleteEvent(id) {
            if (!confirm("Are you sure you want to delete this event?")) return;

            try {
                const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("Event deleted.");
                    loadEvents();
                } else {
                    alert("Failed to delete event.");
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Error deleting event.");
            }
        }

        async function editEvent(id) {
            try {
                const res = await fetch(`${API_BASE}/${id}`);
                if (!res.ok) throw new Error("Event not found");

                const ev = await res.json();

                document.getElementById('editId').value = ev.id;
                document.getElementById('editName').value = ev.name;
                document.getElementById('editStartDate').value = ev.startDate.split("T")[0];
                document.getElementById('editEndDate').value = ev.endDate.split("T")[0];
                document.getElementById('editMaxRegistrations').value = ev.maxRegistrations;
                document.getElementById('editLocation').value = ev.location;

                document.getElementById('edit-event').style.display = 'block';
                document.getElementById('edit-event').scrollIntoView({ behavior: 'smooth' });


            } catch (err) {
                alert("Failed to load event.");
                console.error(err);
            }
        }

        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const event = {
                name: document.getElementById('name').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                maxRegistrations: parseInt(document.getElementById('maxRegistrations').value),
                location: document.getElementById('location').value
            };

            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(event)
                });

                if (res.ok) {
                    alert("Event created!");
                    e.target.reset();
                    loadEvents();
                } else {
                    const error = await res.text();
                    alert('Failed to create event.\n' + error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error connecting to server.');
            }
        });

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('editId').value;
            const event = {
                name: document.getElementById('editName').value,
                startDate: document.getElementById('editStartDate').value,
                endDate: document.getElementById('editEndDate').value,
                maxRegistrations: parseInt(document.getElementById('editMaxRegistrations').value),
                location: document.getElementById('editLocation').value
            };

            try {
                const res = await fetch(`${API_BASE}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(event)
                });

                if (res.ok) {
                    alert("Event updated!");
                    e.target.reset();
                    document.getElementById('edit-event').style.display = 'none';
                    loadEvents();
                } else {
                    const error = await res.text();
                    alert('Failed to update event.\n' + error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error connecting to server.');
            }
        });

        function cancelEdit() {
            document.getElementById('edit-form').reset();
            document.getElementById('edit-event').style.display = 'none';
        }

        window.onload = loadEvents;
    </script>

</body>
</html>
